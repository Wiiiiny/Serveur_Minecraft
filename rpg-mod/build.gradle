plugins {
    id 'fabric-loom' version '1.19.4'
}

version = project.mod_version
group = 'fr.serveur.rpg'
base { archivesName = 'survierpg' }

repositories {
    // TerraBlender (ajout du biome Terres cendrées à l'Overworld) — déjà installé sur le serveur avec Biomes O' Plenty.
    maven { url = 'https://maven.minecraftforge.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "com.github.glitchfiend:TerraBlender-fabric:${project.terrablender_version}"
    // Développement uniquement : Nightfall dans le client de test (n'est pas inclus dans le jar)
    modLocalRuntime files("../nightfall-mod/build/libs/nightfall-1.0.0.jar")
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Loom demande Gradle sous Java 25+, mais le jeu (Mixin de Minecraft 1.20.1) ne démarre pas au-delà de Java 21 :
// les tâches qui lancent le jeu (runClient, runServer, runShots) utilisent donc un JDK 21 (détecté dans ~/.jdks).
tasks.withType(net.fabricmc.loom.task.RunGameTask).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}

// Développement : « gradlew runShots » ouvre le monde de test run/saves/rpgtest
// et capture chaque onglet de l'interface dans run/screenshots/.
loom {
    runs {
        shots {
            client()
            name "Captures interface"
            vmArg "-Dsurvierpg.devshots=true"
            vmArg "-Dnightfall.devshots=true"
            // « gradlew runShots -Pscenario=sombre » : seulement le scénario du monde sombre.
            vmArg "-Dsurvierpg.devshots.scenario=" + (project.findProperty("scenario") ?: "tout")
            programArgs "--quickPlaySingleplayer", "rpgtest", "--width", "1920", "--height", "1080"
        }
    }
}
